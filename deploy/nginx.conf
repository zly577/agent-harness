# Agent Harness —— 公网入口：前端静态 + /api 反代后端
# 用途：复制到 /etc/nginx/sites-available/agent-harness 并软链启用（deploy.sh 自动做）

server {
    listen 80;
    server_name _;                       # 改成你的域名，如 agent.example.com；用公网 IP 访问则保持 _

    # Vue3 构建产物（frontend/dist）
    root /opt/agent-harness/frontend/dist;
    index index.html;

    # 后端 API + SSE 流式（对话流）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # SSE 必须关缓冲，否则对话流不吐字
        proxy_read_timeout 300s;
    }

    # Vue SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可选：公网加一层访问密码（强烈建议开启）
    # 生成：sudo htpasswd -c /etc/nginx/.htpasswd admin
    # location / {
    #     auth_basic "Restricted";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     try_files $uri $uri/ /index.html;
    # }
}
