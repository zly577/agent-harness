name: agent-harness

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agent_harness
      MYSQL_USER: harness
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先生成根目录 .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先生成根目录 .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u harness -D agent_harness -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      MYSQL_URL: mysql+pymysql://harness:${MYSQL_PASSWORD:?请先生成根目录 .env}@mysql:3306/agent_harness?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?请先生成根目录 .env}
      FERNET_KEY: ${FERNET_KEY:?请先生成根目录 .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请先生成根目录 .env}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      REGISTRATION_EMAIL_VERIFICATION: ${REGISTRATION_EMAIL_VERIFICATION:-false}
      SMTP_PROVIDER: ${SMTP_PROVIDER:-custom}
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE:-auto}
      SMTP_OAUTH_TENANT: ${SMTP_OAUTH_TENANT:-common}
      SMTP_OAUTH_CLIENT_ID: ${SMTP_OAUTH_CLIENT_ID:-}
      SMTP_OAUTH_CLIENT_SECRET: ${SMTP_OAUTH_CLIENT_SECRET:-}
      SMTP_OAUTH_REFRESH_TOKEN: ${SMTP_OAUTH_REFRESH_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      SQLITE_PATH: /app/backend/data/harness.sqlite
      HARNESS_WORKSPACE: /app/workspace
      HARNESS_MACHINE_ACCESS: "false"
      HARNESS_ACCESS_MODE: sandbox
      HARNESS_ALLOW_FULL_ACCESS: "false"
      HITL_ENABLED: "true"
      MCP_ENABLED: ${MCP_ENABLED:-true}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-30}
      WEB_SEARCH_PROVIDER_TIMEOUT_SECONDS: ${WEB_SEARCH_PROVIDER_TIMEOUT_SECONDS:-5}
      WEB_SEARCH_PROXY: ${WEB_SEARCH_PROXY:-}
      # Docker 部署始终使用内置沙箱，不受旧 .env 中的关闭开关或宿主机地址影响。
      SANDBOX_ENABLED: "true"
      SANDBOX_DOMAIN: opensandbox:8080
      SANDBOX_PROTOCOL: http
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:?请先生成根目录 .env}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.11}
      SANDBOX_USE_SERVER_PROXY: "true"
      SANDBOX_SYNC_ENABLED: "true"
      SANDBOX_MOUNT_MACHINE_DIRS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/backend/data
      - workspace_data:/app/workspace
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    stop_grace_period: 30s

  opensandbox:
    image: opensandbox/server:release-1.1.0
    restart: unless-stopped
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${SANDBOX_API_KEY:?请先生成根目录 .env}
    configs:
      - source: opensandbox_config
        target: /etc/opensandbox/config.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_data:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

configs:
  opensandbox_config:
    file: ./deploy/docker/opensandbox.toml

volumes:
  mysql_data:
  backend_data:
  workspace_data:
  backend_logs:
  sandbox_data:
