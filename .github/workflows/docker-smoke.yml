name: Docker smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows launcher without starting Docker
        shell: powershell
        run: .\deploy\tests\test-start-windows.ps1

  full-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate deployment config
        run: python3 deploy/init-env.py
      - name: Validate base and sandbox configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config --quiet
          python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Pull sandbox execution images
        run: |
          docker pull python:3.11
          docker pull opensandbox/execd:v1.1.0
      - name: Build and start complete deployment with OpenSandbox
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check web, authentication, policy and real sandbox execution
        run: python3 deploy/smoke-test.py
      - name: Check email registration and SMTP delivery
        run: |
          docker compose cp backend/tests/test_registration_codes.py backend:/tmp/test_registration_codes.py
          docker compose cp backend/tests/test_registration_mail.py backend:/tmp/test_registration_mail.py
          docker compose exec -T backend python -m pytest --noconftest /tmp/test_registration_codes.py /tmp/test_registration_mail.py
      - name: Check personal deployment file modes in Linux container
        run: |
          docker compose cp backend/tests/test_desktop_modes.py backend:/tmp/test_desktop_modes.py
          docker compose exec -T backend python -m pytest --noconftest /tmp/test_desktop_modes.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop test services
        if: always()
        run: docker compose down
